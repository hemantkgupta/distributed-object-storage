spring:
  application:
    name: distributed-object-storage

  datasource:
    url: jdbc:postgresql://localhost:6432/object_metadata
    username: objectadmin
    password: objectpassword

  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Storage node configuration — used by ConsistentHashRing
storage:
  nodes: [1, 2, 3, 4, 5, 6]
  base-path: data/storage-nodes/node-
